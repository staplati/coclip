<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="panelTitle">coclip</title>
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <main>
      <nav id="navList" class="section-nav" data-i18n-aria-label="cardNavigation" aria-label="Card navigation"></nav>

      <div id="notice" class="notice" hidden aria-live="polite"></div>

      <details id="clipboardCard" class="response-card input-card" hidden>
        <summary>
          <span class="fold-icon" aria-hidden="true">›</span>
          <strong class="response-model" data-i18n="input">Input</strong>
        </summary>
        <div class="response-body input-body">
          <pre id="clipboardTextView" class="input-text-view" hidden></pre>
          <div id="imageGrid" class="image-grid" hidden></div>
        </div>
      </details>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-mark" aria-hidden="true">00</div>
        <h2></h2>
        <p></p>
      </div>
      <div id="responseList" class="response-list"></div>
    </main>

    <dialog id="imageDialog" class="image-dialog">
      <button id="closeImageButton" type="button" data-i18n-aria-label="closeOriginal" aria-label="Close original image">×</button>
      <img id="fullImage" data-i18n-alt="originalClipboardImage" alt="Original clipboard image">
    </dialog>

    <template id="responseTemplate">
      <details class="response-card" open>
        <summary>
          <span class="fold-icon" aria-hidden="true">›</span>
          <strong class="response-model"></strong>
        </summary>
        <div class="response-body">
          <div class="markdown-output"></div>
        </div>
      </details>
    </template>

    <script src="vendor/markdown-it/markdown-it.min.js"></script>
    <script src="vendor/katex/katex.min.js"></script>
    <script type="module" src="panel.js"></script>
  </body>
</html>
